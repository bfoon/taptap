<text x='238' y='212' font-size='12' fill='#7dd3fc' font-family='Menlo,Consolas,monospace'>/tool fetch url="https://taptapnetwork.com/api/agent/install/…" \</text>
<text x='238' y='232' font-size='12' fill='#7dd3fc' font-family='Menlo,Consolas,monospace'>    dst-path=taptap-link.rsc mode=https; :delay 2s;</text>
