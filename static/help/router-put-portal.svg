<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 520' width='900' height='520' font-family='Inter,Segoe UI,Roboto,Arial,sans-serif' role='img' aria-label='Put the login page on your routers'>
<title>Put the login page on your routers</title>
<defs><linearGradient id='side' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#0f2a4d'/><stop offset='1' stop-color='#081a33'/></linearGradient>
<filter id='sh' x='-10%' y='-10%' width='120%' height='130%'><feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#0a1423' flood-opacity='.12'/></filter></defs>
<rect width='900' height='520' rx='16' fill='#eef3f9'/>
<rect x='0' y='0' width='900' height='34' rx='16' fill='#dfe7f1'/><rect x='0' y='18' width='900' height='16' fill='#dfe7f1'/>
<circle cx='20' cy='17' r='5' fill='#ff5f57'/><circle cx='37' cy='17' r='5' fill='#febc2e'/><circle cx='54' cy='17' r='5' fill='#28c840'/>
<rect x='80' y='8' width='740' height='18' rx='9' fill='#fff'/><text x='94' y='21' font-size='11' fill='#5b6b7d'>🔒 taptapnetwork.com</text>
<rect x='0' y='34' width='170' height='486' fill='url(#side)'/><text x='20' y='66' font-size='17' font-weight='800' fill='#fff'>TapTap</text><text x='24' y='100' font-size='13' font-weight='700' fill='#9fb2c9'>Overview</text><text x='24' y='134' font-size='13' font-weight='700' fill='#9fb2c9'>Vouchers</text><text x='24' y='168' font-size='13' font-weight='700' fill='#9fb2c9'>Generate</text><text x='24' y='202' font-size='13' font-weight='700' fill='#9fb2c9'>MikroTik Control</text><rect x='10' y='216' width='150' height='30' rx='9' fill='#1769e0'/><text x='24' y='236' font-size='13' font-weight='700' fill='#fff'>Portal Studio</text><text x='24' y='270' font-size='13' font-weight='700' fill='#9fb2c9'>Adverts</text><text x='24' y='304' font-size='13' font-weight='700' fill='#9fb2c9'>Security</text><text x='200' y='76' font-size='22' font-weight='800' fill='#102033'>Portal Studio</text><text x='200' y='98' font-size='12.5' fill='#6c7c90'>Login, status and after-login pages for your customers</text><rect x='690' y='62' width='180' height='38' rx='10' fill='#1769e0'/><text x='780' y='86' font-size='13.5' font-weight='800' fill='#fff' text-anchor='middle'>☁ Put on all routers</text><g filter='url(#sh)'><rect x='200' y='120' width='670' height='300' rx='14' fill='#fff'/></g><text x='222' y='152' font-size='14.5' font-weight='800' fill='#102033'>On your routers</text>
<rect x='222' y='170' width='626' height='52' rx='10' fill='#f0fdf4' stroke='#bbf7d0'/><text x='240' y='192' font-size='13.5' font-weight='800' fill='#102033'>Main Hall</text><text x='240' y='211' font-size='12' fill='#15803d'>✓ login · status · logout installed · walled garden ✓ (http + https) · login.wifi ✓</text>
<rect x='222' y='232' width='626' height='52' rx='10' fill='#fff7ed' stroke='#fed7aa'/><text x='240' y='254' font-size='13.5' font-weight='800' fill='#102033'>Brusubi</text><text x='240' y='273' font-size='12' fill='#9a3412'>⏳ queued — applied at the router's next check-in</text>
<text x='222' y='318' font-size='12.5' fill='#475569'>The router downloads your pages into its hotspot folder and lets them</text>
<text x='222' y='338' font-size='12.5' fill='#475569'>reach TapTap before login (voucher check, wrong-code count, adverts).</text>
<text x='222' y='374' font-size='12.5' fill='#475569'>Customers can also type  </text><rect x='392' y='360' width='84' height='22' rx='6' fill='#eef2f7'/><text x='434' y='376' font-size='12.5' font-weight='800' fill='#102033' text-anchor='middle'>login.wifi</text><text x='484' y='374' font-size='12.5' fill='#475569'>to open the page.</text><circle cx='222' cy='456' r='13' fill='#e5484d'/><text x='222' y='461' font-size='13' font-weight='800' fill='#fff' text-anchor='middle'>1</text><text x='244' y='461' font-size='12.5' font-weight='700' fill='#b42318' text-anchor='start'>Press after every design change and for each new router</text></svg>