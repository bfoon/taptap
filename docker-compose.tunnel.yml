# Production/Linux overlay for TapTap Tunnel.
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# Required in .env:
#   TAPTAP_WG_ENDPOINT=<public IP or UNPROXIED DNS name of this server>
# Recommended in .env:
#   TAPTAP_TUNNEL_SECRET=<long random string>   (encrypts tunnel API passwords;
#                                                falls back to SECRET_KEY)
# Also open UDP ${TAPTAP_WG_PORT:-51820} in any cloud firewall / security group.

x-tunnel-env: &tunnel-env
  # Every container that talks to routers must know the tunnel is on,
  # otherwise web/worker/live keep treating Link routers as Link-only.
  TAPTAP_TUNNEL_ENABLED: "1"

services:
  db:
    # Host-network tunnel manager reaches the same PostgreSQL database here.
    # Localhost-only: this does NOT publish PostgreSQL to the Internet.
    ports:
      - "127.0.0.1:${TAPTAP_TUNNEL_DB_PORT:-5433}:5432"

  web:
    environment: *tunnel-env
    volumes:
      - tunnel_data:/var/lib/taptap-tunnel:ro

  worker:
    environment: *tunnel-env
    volumes:
      - tunnel_data:/var/lib/taptap-tunnel:ro

  live:
    environment: *tunnel-env
    volumes:
      - tunnel_data:/var/lib/taptap-tunnel:ro

  tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    env_file: .env
    environment:
      TAPTAP_TUNNEL_ENABLED: "1"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "${TAPTAP_TUNNEL_DB_PORT:-5433}"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tunnel_data:/var/lib/taptap-tunnel
      - /lib/modules:/lib/modules:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        until python manage.py migrate --check >/dev/null 2>&1;
        do echo 'tunnel: waiting for database migrations...'; sleep 5; done;
        exec python manage.py run_tunnel_manager

volumes:
  tunnel_data:
