# Builds the TapTap app (mobile/) on GitHub.
#
#   Android: every push that touches mobile/ — download the APK from the run's "Artifacts" box.
#            A push to main/master also PUBLISHES it as the GitHub release app-v<version>-<build> (TapTap.apk + its
#            SHA-256): the landing page's "Download for Android" button (core/app_download.py) offers the newest one.
#            Bump `version:` in mobile/pubspec.yaml for a new release; the same version again replaces its file.
#            "What's new" comes from mobile/WHATS_NEW.md if it exists, else from the commit message.
#   iPhone:  Actions → "TapTap mobile app" → Run workflow → tick "Also build iPhone" (unsigned build, a compile check;
#            signing for the App Store is done in Xcode or with your own signing setup).
#
# Optional secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON   the whole google-services.json from Firebase — turns on push and ringing when the app is closed
#   TAPTAP_SERVER          your TapTap address, e.g. https://taptapnetwork.com — the address the app starts with
#
# The android/ and ios/ folders are not in git: each run makes them with `flutter create` and
# mobile/tool/configure_platforms.py adds the permissions (microphone, camera, notifications, background calls).
name: TapTap mobile app

on:
  push:
    branches: [main, master]
    paths: ['mobile/**', '.github/workflows/mobile-app.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-app.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build iPhone (unsigned)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  ORG: gm.easysolutions
  APP: taptap_app

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Java 21, the JDK Android Studio ships. Current Flutter makes the android/ folder with Gradle 9 and Android
      # Gradle Plugin 9, whose lint calls Java 21 methods: on Java 17 the release build died in
      # ":firebase_core:lintVitalAnalyzeRelease" with "NoSuchMethodError: java.util.List.removeLast()".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter and Java versions
        run: |
          flutter config --jdk-dir "$JAVA_HOME"      # build with that Java 21, whatever else the runner has
          flutter --version
          java -version

      - name: Make the android/ folder
        run: |
          flutter create --org "$ORG" --project-name "$APP" --platforms android .
          # flutter create adds a sample test for a "MyApp" class this app does not have — keep only ours
          if grep -q "MyApp" test/widget_test.dart 2>/dev/null; then git checkout -- test/widget_test.dart 2>/dev/null || rm -f test/widget_test.dart; fi

      - name: Firebase config (only if the secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase: on"
          else
            echo "Firebase: off (no GOOGLE_SERVICES_JSON secret) — the app works while it is open"
          fi

      - name: Permissions and settings
        run: python3 tool/configure_platforms.py

      - name: Server address
        env:
          TAPTAP_SERVER: ${{ secrets.TAPTAP_SERVER }}
        run: |
          if [ -n "$TAPTAP_SERVER" ]; then
            sed -i "s#static const defaultServer = '.*';#static const defaultServer = '${TAPTAP_SERVER%/}';#" lib/app/api.dart
            grep -n "defaultServer =" lib/app/api.dart
          fi

      - name: Packages
        run: flutter pub get

      - name: Analyze (shows problems, does not stop the build)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rename
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/TapTap-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TapTap-android-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

  publish:
    name: Publish for the landing page
    needs: android
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # only this job may create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TapTap-android-${{ github.run_number }}
          path: out

      - name: Version, file and notes
        id: v
        run: |
          full=$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | head -1 | tr -d '\r ')
          name=${full%%+*}; build=${full#*+}; [ "$build" = "$full" ] && build=0
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          cp out/*.apk out/TapTap.apk
          (cd out && sha256sum TapTap.apk | cut -d' ' -f1 > TapTap.apk.sha256 && cat TapTap.apk.sha256)
          if [ -s mobile/WHATS_NEW.md ]; then cp mobile/WHATS_NEW.md notes.md; else git log -1 --format='- %s' > notes.md; fi
          printf '\nSHA-256 of TapTap.apk: %s\n' "$(cat out/TapTap.apk.sha256)" >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.v.outputs.name }}-${{ steps.v.outputs.build }}
          name: TapTap app ${{ steps.v.outputs.name }} (build ${{ steps.v.outputs.build }})
          body_path: notes.md
          files: |
            out/TapTap.apk
            out/TapTap.apk.sha256
          make_latest: true
          overwrite_files: true

  ios:
    name: iPhone (unsigned)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Make the ios/ folder
        run: |
          flutter create --org "$ORG" --project-name "$APP" --platforms ios .
          if grep -q "MyApp" test/widget_test.dart 2>/dev/null; then git checkout -- test/widget_test.dart 2>/dev/null || rm -f test/widget_test.dart; fi

      - name: Permissions and settings
        run: python3 tool/configure_platforms.py

      - name: Packages
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Pack
        run: |
          mkdir -p ../out
          cd build/ios/iphoneos && zip -qr "../../../../out/TapTap-ios-unsigned-${GITHUB_RUN_NUMBER}.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: TapTap-ios-unsigned-${{ github.run_number }}
          path: out/*.zip
          retention-days: 14
