<!doctype html><html><body style="margin:0;background:#f6f8f7;font-family:Arial,sans-serif;color:#14213d"><div style="max-width:600px;margin:auto;padding:28px 18px"><div style="background:#fff;border:1px solid #dde5e2;border-radius:16px;padding:26px">
<h2 style="margin:0 0 12px">{{ title }}</h2><p>Hello {{ investor.name }},</p>
{% for l in lines %}<p style="line-height:1.55">{{ l }}</p>{% endfor %}
<p style="margin:24px 0"><a href="{{ url }}" style="background:#14213d;color:#fff;text-decoration:none;padding:12px 18px;border-radius:9px;font-weight:bold">{{ button }}</a></p>
<p style="font-size:12px;color:#4a5874">The button signs you in once and works for 12 hours.{% if investment %} Reference {{ investment.reference }}.{% endif %}</p>
<p style="font-size:12px;color:#4a5874">{{ business.business_name }}</p></div></div></body></html>
