{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b1220">
<title>Call — TapTap</title>
<link href="{% static 'css/chat-call.css' %}?v=call2" rel="stylesheet">
</head>
<body>
<div id="ttCall" data-csrf="{{ csrf_token }}" data-thread="{{ thread }}" data-video="{{ video|yesno:'1,0' }}"
     data-join="{{ join }}" data-embedded="{{ embedded|yesno:'1,0' }}" data-me="{{ me }}" data-me-initials="{{ me_initials }}"
     data-image-days="{{ image_days }}" data-video-secs="{{ video_secs }}" data-video-mb="{{ video_mb }}"></div>
<noscript>Calls need JavaScript.</noscript>
<script src="{% static 'js/chat-call.js' %}?v=call2" defer></script>
</body></html>
