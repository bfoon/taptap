{% if show %}<nav class="tt-vm-switch tt-sa-switch" aria-label="Daily sales or agents">
  <a href="{% url 'sales_daily' %}" class="{% if active == 'sales' %}on{% endif %}"{% if active == 'sales' %} aria-current="page"{% endif %} title="Sales recorded today">
    <i class="bi bi-calendar-day"></i><span>Daily sales</span><b>{{ n_sales }}</b></a>
  <a href="{% url 'finance' %}?tab=agents" class="{% if active == 'agents' %}on{% endif %}"{% if active == 'agents' %} aria-current="page"{% endif %} title="Active agents">
    <i class="bi bi-shop"></i><span>Agents</span><b>{{ n_agents }}</b></a>
</nav>
<style>
.tt-vm-switch{display:inline-flex;gap:.25rem;padding:.25rem;margin:0 0 1rem;border-radius:14px;background:#e9eff7;border:1px solid var(--border)}
.tt-vm-switch a{display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .95rem;border-radius:11px;color:#4d6178;font-weight:700;font-size:.9rem;transition:background .15s,color .15s}
.tt-vm-switch a:hover{color:var(--ink);background:#ffffff90}
.tt-vm-switch a.on{background:#fff;color:var(--primary);box-shadow:0 2px 8px #1d3b5a1a}
.tt-vm-switch b{font-size:.72rem;font-weight:800;padding:.1rem .45rem;border-radius:999px;background:#dbe5f1;color:#4d6178}
.tt-vm-switch a.on b{background:#e3eeff;color:var(--primary)}
html[data-theme=dark] .tt-vm-switch{background:#122236;border-color:#1f3550}
html[data-theme=dark] .tt-vm-switch a{color:#9db2c8}
html[data-theme=dark] .tt-vm-switch a.on{background:#0b1a2b;color:#7db4ff}
html[data-theme=dark] .tt-vm-switch b{background:#1f3550;color:#9db2c8}
</style>{% endif %}
