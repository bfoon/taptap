{# Serial number pattern picker. Needs sn = serials.settings_ctx(); optional: sn_generate (shows start + save-default), sn_title. #}
<div class="sn-fmt" data-next="{{ sn.next_json }}">
  <div class="d-flex justify-content-between align-items-baseline flex-wrap gap-2"><label class="m-0 fw-bold">{{ sn_title|default:"Serial numbers" }}</label>
    <small class="text-secondary">Printed on each card as <code>{serial}</code></small></div>
  <div class="row g-3 mt-0">
    <div class="col-md-7"><label class="small">Pattern</label>
      <input class="form-control font-monospace" name="serial_format" maxlength="40" value="{{ sn.fmt }}" autocomplete="off" aria-label="Serial pattern">
      <div class="d-flex flex-wrap gap-1 mt-2 sn-chips">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{n}" title="Running number">{n} number</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{bn}" title="Number inside this batch: 1, 2, 3…">{bn} in batch</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{batch}" title="The batch's number">{batch}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{yy}" title="Year, 2 digits">{yy}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{yyyy}" title="Year, 4 digits">{yyyy}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{mm}" title="Month">{mm}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{dd}" title="Day">{dd}</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-t="{plan}" title="Plan initials, e.g. 1 Day Pass → 1DP">{plan}</button>
      </div>
      <div class="d-flex flex-wrap gap-1 mt-2"><small class="text-secondary me-1">Ideas:</small>
        <button type="button" class="btn btn-sm btn-light sn-ex" data-v="{n}">{n}</button>
        <button type="button" class="btn btn-sm btn-light sn-ex" data-v="KN-{n}">KN-{n}</button>
        <button type="button" class="btn btn-sm btn-light sn-ex" data-v="{yy}{mm}-{n}">{yy}{mm}-{n}</button>
        <button type="button" class="btn btn-sm btn-light sn-ex" data-v="{plan}-{batch}-{bn}">{plan}-{batch}-{bn}</button>
      </div></div>
    <div class="col-6 col-md-2"><label class="small">Digits</label>
      <input class="form-control" type="number" name="serial_digits" min="1" max="10" value="{{ sn.digits }}" aria-label="Digits"></div>
    <div class="col-6 col-md-3"><label class="small">Start again</label>
      <select class="form-select" name="serial_reset" aria-label="Restart numbering">{% for k,l in sn.resets %}<option value="{{ k }}" {% if sn.reset == k %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
    {% if sn_generate %}
    <div class="col-md-5"><label class="small">Start at <span class="text-secondary fw-normal">(optional)</span></label>
      <input class="form-control" type="number" name="serial_start" min="1" value="{{ sn.start }}" placeholder="Next: " aria-label="Start at"></div>
    <div class="col-md-7 d-flex align-items-end"><label class="form-check m-0"><input class="form-check-input" type="checkbox" name="serial_save" value="1"> Use this pattern from now on</label></div>
    {% endif %}
  </div>
  <div class="mt-3 p-2 rounded-3 bg-light small sn-prev"></div>
</div>
<script>
(function(){
  var box=document.currentScript.previousElementSibling,f=box.closest('form'),NEXT=JSON.parse(box.dataset.next||'{}');
  var q=function(n){return box.querySelector('[name='+n+']');},fmt=q('serial_format'),dig=q('serial_digits'),rst=q('serial_reset'),st=q('serial_start'),out=box.querySelector('.sn-prev');
  function ini(p){var w=String(p||'').match(/[A-Za-z0-9]+/g)||[];return (w.map(function(x){return /^\d+$/.test(x)?x:x[0];}).join('').toUpperCase().slice(0,5))||'X';}
  function render(pat,n,bn,plan){var d=new Date(),D=Math.max(1,Math.min(10,+dig.value||6)),pad=function(v){v=String(v);while(v.length<D)v='0'+v;return v;},p2=function(v){return(v<10?'0':'')+v;};
    return pat.replace(/\{(n|bn|batch|yyyy|yy|mm|dd|plan)\}/g,function(_,t){return {n:pad(n),bn:pad(bn),batch:'42',yyyy:d.getFullYear(),yy:String(d.getFullYear()).slice(2),mm:p2(d.getMonth()+1),dd:p2(d.getDate()),plan:ini(plan)}[t];});}
  function upd(){var pat=fmt.value.trim()||'{n}',r=rst.value,qty=(f&&f.elements.quantity?+f.elements.quantity.value:0)||1;
    var plan=(f&&f.elements.plan&&f.elements.plan.selectedOptions[0])?f.elements.plan.selectedOptions[0].text.replace(/\s*[—–-]\s*.*$/,''):'1 Day Pass';
    var nx=r==='batch'?1:(NEXT[r]||1); if(st){st.placeholder='Next: '+nx;} var first=(st&&+st.value)?+st.value:nx;
    var bad=/\{(?!n\}|bn\}|batch\}|yyyy\}|yy\}|mm\}|dd\}|plan\})[^}]*\}/.test(pat)?'Unknown part in the pattern.':(!/\{n\}|\{bn\}/.test(pat)?'Add {n} or {bn}, or every card gets the same serial.':'');
    out.innerHTML=bad?'<span class="text-danger">'+bad+'</span>':'Example: <b class="font-monospace">'+render(pat,first,1,plan)+'</b>'+(qty>1?' … <b class="font-monospace">'+render(pat,first+qty-1,qty,plan)+'</b> ('+qty+' vouchers)':'')+
      (r==='batch'?' · numbers start at 1 in every batch':(r==='never'?' · one running number, never repeats':' · the number starts again at 1 each '+({yearly:'year',monthly:'month',daily:'day'}[r])));}
  box.querySelectorAll('.sn-chips button').forEach(function(b){b.onclick=function(){var s=fmt.selectionStart==null?fmt.value.length:fmt.selectionStart;fmt.value=fmt.value.slice(0,s)+b.dataset.t+fmt.value.slice(fmt.selectionEnd||s);fmt.focus();upd();};});
  box.querySelectorAll('.sn-ex').forEach(function(b){b.onclick=function(){fmt.value=b.dataset.v;upd();};});
  (f||box).addEventListener('input',upd);(f||box).addEventListener('change',upd);upd();
})();
</script>
