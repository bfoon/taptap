<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapTap Member Portal</title><style>
body{margin:0;background:#f3f6fa;color:#142337;font:15px/1.45 system-ui,sans-serif}.wrap{max-width:440px;margin:7vh auto;padding:18px}.card{background:white;border:1px solid #dce5ef;border-radius:18px;padding:28px;box-shadow:0 14px 45px #20354d14}.brand{font-weight:850;font-size:25px}.muted{color:#6d7c8d}label{display:block;font-weight:750;margin:24px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #cbd6e2;border-radius:10px;padding:12px;font-size:16px}button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:12px;background:#0b5ed7;color:white;font-weight:800;font-size:15px}.msg{padding:10px 12px;border-radius:10px;margin:12px 0;background:#eef7ff}.foot{margin-top:18px;font-size:12px;color:#7a8998;text-align:center}
</style></head><body><div class="wrap"><div class="card"><div class="brand">TapTap Member Portal</div><p class="muted">Manage devices, security, bills and your membership.</p>{% if messages %}{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% endif %}<form method="post" action="{% url 'member_portal_request' %}">{% csrf_token %}<label>Email address</label><input type="email" name="email" autocomplete="email" required placeholder="Your member email"><button>Email me a secure access link</button></form><p class="foot">The emailed link expires after a short time and can only be used once.</p></div></div></body></html>
