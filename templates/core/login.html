{% extends 'core/base.html' %}{% block title %}Business Login — TapTap{% endblock %}{% block public_content %}<div class="auth-page"><div class="auth-card"><a class="brand justify-content-center mb-4" href="/"><span class="brand-mark"><i class="bi bi-wifi"></i></span><span>TapTap</span></a><h2>Welcome back</h2><p>Sign in to your Wi‑Fi business control center.</p>{% for message in messages %}<div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} py-2 small">{{ message }}</div>{% endfor %}<form method="post">{% csrf_token %}<label>Email</label><input class="form-control" type="email" name="email" value="{{ email|default:'' }}" autocomplete="username" required><label>Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ request.GET.next|default:'' }}"><button class="btn btn-primary w-100 mt-3">Sign in</button></form><div class="auth-bottom">New to TapTap? <a href="{% url 'register' %}">Start free</a></div></div></div>{% endblock %}
