services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taptap}
      POSTGRES_USER: ${POSTGRES_USER:-taptap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taptap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taptap} -d ${POSTGRES_DB:-taptap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Data stays durable through the append-only file. The extra RDB snapshots (Redis default: every minute
    # under load) fork the whole process and could freeze Redis for over a second on a busy server, which
    # surfaced as random "Server Error (500)" pages that went away on refresh.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # WEB_BIND examples: 8000 (all interfaces) | 127.0.0.1:8001 (behind host nginx)
      - "${WEB_BIND:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c", "celery -A config worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles

  vouchers:
    # Voucher fast lane: pushes new/changed vouchers to Direct API / Tunnel routers the moment they change, and the
    # voucher sweeper retries any that could not be sent (every VOUCHER_SWEEP_SECONDS, default 10).
    # Nothing else runs here, so a voucher never waits behind a full sync or the live loop. 4 at a time by default:
    # one slow or unreachable router (up to MIKROTIK_TIMEOUT) must not hold back the vouchers of the others.
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'vouchers: waiting for database migrations...'; sleep 5; done; exec celery -A config worker -Q vouchers -n vouchers@%h --concurrency=${VOUCHER_WORKER_CONCURRENCY:-4} --loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  live:
    # Scheduler + live-sync worker: a quick connection check of every router every ROUTER_PULSE_SECONDS (10), the full live
    # check every LIVE_WATCH_SECONDS (15), housekeeping every 30 s. Only the live queue: voucher pushes have their own
    # worker (below), so they can never hold up a router check.
    build: .
    restart: unless-stopped
    env_file: .env
    # Waits until the database is fully migrated so it never runs new code against an old schema.
    entrypoint: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'live: waiting for database migrations...'; sleep 5; done; exec celery -A config worker -Q live -B --concurrency=${LIVE_WORKER_CONCURRENCY:-3} --loglevel=INFO --schedule=/tmp/celerybeat-schedule"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  turn:
    # TURN relay for chat calls and screen sharing (coturn). Optional — start it with:
    #   docker compose --profile turn up -d turn
    # Without it, calls between mobile networks (carrier-grade NAT), strict office firewalls or a router that
    # fails over between two internet links cannot always connect directly, and drop more often.
    # Needs in .env (web reads the same secret, so credentials match):
    #   CHAT_TURN_SECRET=<long random string>
    #   CHAT_TURN_URLS=turn:turn.taptapnetwork.com:3478?transport=udp,turn:turn.taptapnetwork.com:3478?transport=tcp
    #   TURN_EXTERNAL_IP=<this server's public IP>   (needed when the server sits behind NAT, e.g. most clouds)
    #   TURN_REALM=taptapnetwork.com                 (optional)
    # The TURN hostname must point straight at this server (DNS only, NOT through a Cloudflare proxy).
    # Open in the firewall: 3478/udp, 3478/tcp and the relay range ${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49359}/udp.
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    restart: unless-stopped
    network_mode: host
    environment:
      CHAT_TURN_SECRET: ${CHAT_TURN_SECRET:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_REALM: ${TURN_REALM:-taptapnetwork.com}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49359}
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$CHAT_TURN_SECRET" ]; then echo 'turn: set CHAT_TURN_SECRET in .env'; sleep 60; exit 1; fi;
        exec turnserver -n --log-file=stdout --no-cli --fingerprint
        --listening-port=3478
        --use-auth-secret --static-auth-secret="$$CHAT_TURN_SECRET" --realm="$$TURN_REALM"
        $${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
        --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT"
        --no-multicast-peers --no-tlsv1 --no-tlsv1_1 --stale-nonce=600
        --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
        --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
        --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
        --denied-peer-ip=192.168.0.0-192.168.255.255 --denied-peer-ip=::1
        --total-quota=200 --user-quota=12

volumes:
  postgres_data:
  redis_data:
  static_volume:
