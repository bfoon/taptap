services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taptap}
      POSTGRES_USER: ${POSTGRES_USER:-taptap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taptap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taptap} -d ${POSTGRES_DB:-taptap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # WEB_BIND examples: 8000 (all interfaces) | 127.0.0.1:8001 (behind host nginx)
      - "${WEB_BIND:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c", "celery -A config worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2}"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles

  vouchers:
    # Voucher fast lane: pushes new/changed vouchers to Direct API / Tunnel routers the moment they change.
    # Nothing else runs here, so a voucher never waits behind a full sync or the live loop.
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'vouchers: waiting for database migrations...'; sleep 5; done; exec celery -A config worker -Q vouchers -n vouchers@%h --concurrency=${VOUCHER_WORKER_CONCURRENCY:-2} --loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  live:
    # Scheduler + live-sync worker: checks every router every LIVE_WATCH_SECONDS (default 15).
    build: .
    restart: unless-stopped
    env_file: .env
    # Waits until the database is fully migrated so it never runs new code against an old schema.
    entrypoint: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do echo 'live: waiting for database migrations...'; sleep 5; done; exec celery -A config worker -Q live,vouchers -B --concurrency=2 --loglevel=INFO --schedule=/tmp/celerybeat-schedule"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
